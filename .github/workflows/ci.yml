name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在途的任务，避免排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 人工批准闸门：在 Settings → Environments 新建同名环境并添加 Required reviewers 后生效。
    # 未配置该环境时这一行是空操作，CI 仍会直接运行。
    environment: ci-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle wrapper 与依赖。PR 只读缓存，避免来自 fork 的缓存投毒。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # 不用 android-actions/setup-android：它默认执行 sdkmanager "tools" "platform-tools"，
      # 而 legacy 包 tools 已从 SDK 仓库移除，会以 "Failed to find package 'tools'" 失败。
      # ubuntu 镜像自带的 SDK 已够用，这里只补装 compileSdk 需要的平台。
      - name: Install SDK platform
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      # 仓库不含私有 Cubism SDK，构建会自动回退 src/lite（见 app/build.gradle.kts）。
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      # lint 默认遇到 error 级问题即失败；warning 不阻断（依赖升级、图标等留待人工决策）。
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --console=plain --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
