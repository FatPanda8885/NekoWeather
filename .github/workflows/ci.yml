name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在途的任务，避免排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle wrapper 与依赖。PR 只读缓存，避免来自 fork 的缓存投毒。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk = 35；runner 镜像不保证预装该平台，显式安装。
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # 仓库不含私有 Cubism SDK，构建会自动回退 src/lite（见 app/build.gradle.kts）。
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
