name: Release

# 只允许手动触发：在 Actions 页面点 Run workflow，填入版本号才开始构建与发布。
# 不监听 tag push，避免误推 tag 就自动发版。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（与 app/build.gradle.kts 的 versionName 一致，如 1.2.0）'
        required: true
      notes:
        description: '发布说明（留空则自动生成）'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 必须拉全量与 tag：默认 fetch-depth: 1 且不取 tag，下面的 v<版本> 重复检查会永远
      # 查不到远端已有 tag，门禁形同虚设（会导致把新 APK 挂到旧 tag 上）。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK platform
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      # 签名材料不入库：keystore 以 base64 放在 secret 里，构建时还原成 signing/keystore.properties。
      # 需要的 secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 生成 KEYSTORE_BASE64（Windows PowerShell）：
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes('release.jks'))
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo '::error::缺少签名 secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），未签名的 APK 无法覆盖安装，已中止'
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo 'storeFile=signing/release.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/keystore.properties

      # 版本号以 app/build.gradle.kts 为唯一来源；这里只校验，不改写仓库文件。
      - name: Check version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          ACTUAL=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::app/build.gradle.kts 的 versionName 是 $ACTUAL，与输入的 $VERSION 不一致。请先提交版本号变更（含 versionCode）"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION 已存在"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      # 资源名必须让应用内更新能按 ABI 选中：app-<abi>-release.apk -> NekoWeather-<version>-<abi>.apk
      - name: Collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=${base#app-}
            abi=${abi%-release.apk}
            cp "$f" "dist/NekoWeather-${VERSION}-${abi}.apk"
          done
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "${NOTES:-}" ]; then
            NOTES="由 GitHub Actions 构建，提交 $GITHUB_SHA"
          fi
          gh release create "v$VERSION" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
